name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUF_VERSION: 1.72.0
  GO_VERSION: "1.26"

jobs:
  # The protobuf files are the contract shared by the Go core and, later, the
  # SwiftUI, WinUI and web clients. Checking in generated code means those
  # projects can build without installing buf; this job is what keeps the
  # checked-in output honest.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v${{ env.BUF_VERSION }}

      - run: buf format --diff --exit-code
      - run: buf lint

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        # Passed through the environment rather than interpolated into the
        # shell, so a ref name can never be executed as a command.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: buf breaking --against ".git#branch=origin/${BASE_REF}"

      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- core/gen

  core:
    strategy:
      fail-fast: false
      matrix:
        # Process handling, path semantics and file replacement differ enough
        # per platform that cross-compiling and declaring victory would be
        # meaningless. Each OS runs its own tests.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  # The unit tests above have never caught this project's real defects. Those
  # have all been in assembly seams — a daemon that never wired the projector,
  # a codec that did not know an event, a bot that connected and then ignored
  # everything — and every one of them was visible within seconds of running
  # the daemon for real. So CI runs it for real.
  #
  # Linux only: these start processes and bind ports, and running the same
  # checks three times would buy little for what it costs in flakiness.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # verify-artifacts needs a provider credential, because only a model
      # calls tools. It skips itself here rather than failing.
      - run: ./scripts/verify-all.sh

  # The image is a deployment and must carry none of one. What goes wrong is
  # not that it fails to build: it is that it carries a settings file that
  # becomes the operator's by accident, or a credential in a layer anybody who
  # can pull it reads back, or that it runs as root, or that it comes up
  # without the things a command needs and every tool call fails at once.
  #
  # Built on every change so a broken Dockerfile is caught by the change that
  # broke it. Pushed only from main and from tags: a pull request from a fork
  # must not be able to publish under this name.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # What the image claims about itself, checked by running it. One
      # architecture, because this proves properties of the image rather than
      # of the platform, and the same assertions under emulation would cost
      # minutes to say the same thing.
      - name: The image is a deployment and carries none of one
        run: ./scripts/verify-container.sh

      # arm64 as well, and only where it is going to be published. Under
      # emulation it is slow, and a pull request does not need it to know
      # whether the Dockerfile is broken.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cased outright rather than through github.repository, which
      # carries the owner's capitals and which a registry will not take.
      - id: names
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/koukeneko/jingclaw
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: ${{ steps.names.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
