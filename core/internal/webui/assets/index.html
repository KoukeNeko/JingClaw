<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>JingClaw</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app" hidden>
  <aside id="sidebar">
    <header>
      <h1>JingClaw</h1>
      <button id="new-session" type="button">New session</button>
    </header>
    <ul id="sessions" aria-label="Sessions"></ul>
    <footer id="daemon-status">connecting…</footer>
  </aside>

  <main>
    <header id="session-header">
      <h2 id="session-title">No session selected</h2>
      <div class="controls">
        <select id="model" aria-label="Which model answers here" hidden></select>
        <span id="run-status"></span>
        <button id="interrupt" type="button" hidden>Interrupt</button>
      </div>
    </header>

    <section id="plan" hidden aria-label="What the agent is doing"></section>

    <section id="questions" hidden aria-label="Waiting for an answer"></section>

    <section id="approvals" hidden aria-label="Waiting for a decision"></section>

    <ol id="timeline" aria-label="Timeline" aria-live="polite"></ol>

    <form id="composer">
      <textarea id="input" rows="3" placeholder="Say something. Enter sends, Shift+Enter makes a new line."
                autocomplete="off" spellcheck="false" disabled></textarea>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </main>
</div>

<div id="locked">
  <div class="card">
    <h1>JingClaw</h1>
    <p>This console needs a pairing code. <code>agentd</code> printed one when it started:</p>
    <p class="hint"><code>agent console</code> prints another. A code works once and expires,
       so what it leaves in a terminal's scrollback stops being worth anything.</p>
    <form id="unlock">
      <label for="code">Paste the code</label>
      <input id="code" type="text" autocomplete="off" spellcheck="false"
             placeholder="XXXX-XXXX-XXXX-XXXX">
      <button type="submit">Pair</button>
    </form>
    <p id="unlock-error" role="alert" hidden></p>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
