# JingClaw and a model, as one deployment.
#
#   cp .env.example .env      # put the bot token in it
#   docker compose up -d
#   docker compose exec ollama ollama pull "${OLLAMA_MODEL:-gemma4}"
#
# The pull is a separate step on purpose: models are gigabytes, and which one
# a deployment should run is not a decision this file can make for it.

services:
  jingclaw:
    image: ghcr.io/koukeneko/jingclaw:latest
    depends_on:
      - ollama
    restart: unless-stopped

    # Long enough for a run in progress to be written down. The signal reaches
    # jingclaw through tini, and it stops the gateway and then the daemon, which
    # is given up to 15s (docs/container.md, "Stopping it").
    stop_grace_period: 30s

    volumes:
      # The one path to mount. A volume mounted anywhere else is created
      # owned by root, and this image does not run as root.
      - jingclaw:/var/lib/jingclaw

    environment:
      # Required, and named here so a missing one fails at "compose up" with
      # a sentence rather than at runtime with a login error.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?put it in .env, see .env.example}

      # The whole settings text, saved in the database on the first start only
      # and never over settings that are already there. Editing it here after
      # that changes nothing: the settings are the database's from then on,
      # and the dashboard that edits them cannot be reached from a container
      # yet. A new volume is what starts again from this; a variable named for
      # one setting, such as JINGCLAW_MEMORY_ENABLED, wins over it on every
      # start. docs/container.md says more.
      JINGCLAW_CONFIG: |
        [provider]
        backend = "ollama"

        [provider.ollama]
        model = "${OLLAMA_MODEL:-gemma4}"
        # The service below, on the network compose puts them both on.
        base_url = "http://ollama:11434"

        [gateway]
        platform = "discord"

        [gateway.discord]
        account_id = "main"

        # Rooms people can type in. Fill in the ids from Discord; without
        # this the agent connects and answers nobody.
        # [[gateway.discord.channels]]
        # channel_ids = ["000000000000000000"]
        # tenant_id = "000000000000000000"
        # workspace_id = "default"

      # Saved the same way, on the first start only.
      JINGCLAW_PERSONA: |
        # Who you are

        Answer briefly. Say when you are unsure.

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    volumes:
      # Where pulled models live. Without this every restart pulls again.
      - ollama:/root/.ollama

    # No published port. Only jingclaw needs to reach it, and compose already
    # puts them on a network where it can. Publishing 11434 would put an
    # unauthenticated model server on the host's interfaces.

    # An NVIDIA host can hand the GPU over. Left out rather than commented in,
    # because a machine without one fails to start with it present — and on a
    # Mac it makes no difference either way: Docker cannot reach the Mac GPU,
    # so a model in a container here runs on the CPU. Point at the host's own
    # Ollama instead; docs/container.md says how.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

volumes:
  jingclaw:
  ollama:
