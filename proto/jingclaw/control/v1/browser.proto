syntax = "proto3";

package jingclaw.control.v1;

import "google/protobuf/timestamp.proto";
import "jingclaw/control/v1/common.proto";

// BrowserService is how a person lets a browser into the control surface.
//
// A browser never holds the operator's own credential. That one is read from a
// file by programs on this machine, and putting it in a page or in an address
// would put it in a history, a log and anything that can see a screen. What a
// browser gets instead is its own: it is handed a code that works once, for a
// minute, and trades it for a credential of its own that expires.
//
// Reachable by the operator's own credential and by nothing else.
service BrowserService {
  // CreatePairing makes a code for one browser to trade for a session.
  //
  // The code is spent by the first browser to present it, so somebody who
  // sees the address after it was used has nothing.
  rpc CreatePairing(CreatePairingRequest) returns (CreatePairingResponse);

  // SetDashboardPassword replaces the dashboard password. Until it has been
  // changed once, the password is the initial one and no current password is
  // asked for; after that the current one has to be given. The new one must
  // differ from the initial one. Every other browser is signed out.
  //
  // The operator's own credential, a browser that is already in, and a setup
  // session (what the initial password signs in as, and which can call nothing
  // else) can ask; the password is never returned by anything. A setup session
  // is answered with a control session of its own to continue with.
  rpc SetDashboardPassword(SetDashboardPasswordRequest) returns (SetDashboardPasswordResponse);

  // ClearDashboardPassword puts the password back to the initial one, and
  // every browser is signed out.
  rpc ClearDashboardPassword(ClearDashboardPasswordRequest) returns (ClearDashboardPasswordResponse);
}

message CreatePairingRequest {
  RequestMeta meta = 1;
}

message CreatePairingResponse {
  string code = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message SetDashboardPasswordRequest {
  RequestMeta meta = 1;

  // Ten to 256 characters.
  string new_password = 2;

  // Required once the password has been changed; ignored while it is the
  // initial one.
  string current_password = 3;
}

message SetDashboardPasswordResponse {
  // Set only when the caller was a setup session: a control session to
  // continue with, as the login gives. Empty otherwise.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ClearDashboardPasswordRequest {
  RequestMeta meta = 1;
  string current_password = 2;
}

message ClearDashboardPasswordResponse {}
