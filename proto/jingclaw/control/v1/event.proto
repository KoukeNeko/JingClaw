syntax = "proto3";

package jingclaw.control.v1;

import "google/protobuf/timestamp.proto";
import "jingclaw/control/v1/common.proto";

// The append-only event log is the source of truth for session history.
// Message history shown in a UI is a projection of these, never the reverse.
message Event {
  string id = 1;

  string session_id = 2;
  string run_id = 3;

  // Strictly increasing within a session. Clients use it to resume after a
  // disconnect and to detect gaps.
  uint64 seq = 4;

  google.protobuf.Timestamp occurred_at = 5;

  // Where this event sits in the whole log, as against seq, which is where it
  // sits in its own session.
  //
  // For a client watching every session at once, which cannot resume from
  // seq: two sessions both at 50 make "I have read up to 50" mean nothing.
  // Strictly increasing across the deployment, but not dense — pruning leaves
  // gaps, and a cursor needs to be monotonic rather than contiguous.
  //
  // Zero on an event from a deployment written before positions were kept.
  uint64 global_seq = 6;

  oneof payload {
    UserMessageAdded user_message_added = 10;
    RunStateChanged run_state_changed = 11;
    AssistantTextDelta assistant_text_delta = 12;
    AssistantMessageCompleted assistant_message_completed = 13;
    UsageChanged usage_changed = 14;
    ToolCallRequested tool_call_requested = 15;
    ToolCallCompleted tool_call_completed = 16;
    ApprovalRequested approval_requested = 17;
    ApprovalResolved approval_resolved = 18;
    ConversationCompacted conversation_compacted = 19;
    RunDirections run_directions = 20;
    AssistantReasoningDelta assistant_reasoning_delta = 21;
    PlanChanged plan_changed = 22;
    QuestionAsked question_asked = 23;
    QuestionAnswered question_answered = 24;
    SkillActivated skill_activated = 25;
  }
}

message UserMessageAdded {
  string message_id = 1;
  string text = 2;

  TrustLevel trust = 3;
  RunOrigin origin = 4;

  // Files that arrived with it, by reference. The bytes are in the artifact
  // store: an image is large and this event is replayed on every turn.
  repeated MessageAttachment attachments = 5;
}

// MessageAttachment is a file that came with a message.
//
// An empty artifact_id means it was not kept — too large, or a kind of file
// this agent does not store. The rest of the fields still arrive, because a
// message that makes no sense without its attachment should at least say one
// was sent.
message MessageAttachment {
  string artifact_id = 1;
  string name = 2;
  string media_type = 3;
  int64 size = 4;
}

message RunStateChanged {
  RunStatus status = 1;

  // Populated on CANCELLED and FAILED. Written for whoever is debugging: it
  // may carry a provider's own wording verbatim, so it belongs in a log or a
  // control-plane client and not in a chat channel somebody else can read.
  string reason = 2;

  // A stable token naming what went wrong, for a client that has to decide
  // what to say without reading the sentence above. Empty when unclassified.
  //
  // A string rather than an enum because the set grows as providers are added,
  // and an unrecognised token read as UNSPECIFIED is how a client ends up
  // confidently saying the wrong thing.
  string failure_kind = 3;
}

// Provider deltas are coalesced before becoming events: one row per token
// would make the log unusable and, once persisted, would hammer the database.
message AssistantTextDelta {
  string message_id = 1;
  string text = 2;
}

// The model's working-out, where a provider exposes it.
//
// Never sent to a chat platform. The projector refuses it, console channel
// included: a platform account is somebody's account, and the working-out
// quotes whatever the run has been reading.
message AssistantReasoningDelta {
  string message_id = 1;
  string text = 2;
}

message AssistantMessageCompleted {
  string message_id = 1;
  StopReason stop_reason = 2;
}

// The model asking for a tool, recorded before anything runs. Kept separate
// from the result so a client can show work in progress, and so a call that
// never completed stays visible after a crash.
message ToolCallRequested {
  string call_id = 1;
  string name = 2;

  // Arguments as JSON, after validation against the tool's schema.
  string arguments = 3;
}

// The observation handed back to the model.
// Artifact refers to content the daemon holds, which a client fetches with
// ArtifactService rather than receiving inline. The bytes are deliberately not
// in the event: the point of storing them is that they do not travel.
message Artifact {
  string id = 1;
  int64 size = 2;
  string media_type = 3;
}

message ToolCallCompleted {
  string call_id = 1;
  string name = 2;

  // A short line for a UI timeline.
  string summary = 3;

  // What the model actually saw. Stored in full because the next turn's
  // conversation is rebuilt from this log.
  string content = 4;

  bool is_error = 5;
  bool truncated = 6;

  int64 duration_ms = 7;

  // The whole of what content is an excerpt of, when the tool stored one. A
  // truncated result with no artifact is output that is gone.
  Artifact artifact = 8;

  // Whether the result carried text somebody else wrote — a page, a tool
  // server's output. What the model writes after reading one of these may be
  // its own conclusion or may be the page talking, and a client showing the
  // difference is showing something worth knowing.
  bool foreign = 9;
}

// A run has paused for a human. Every client sees this, so whoever is nearest
// can answer.
// PlanItem is one step of what the agent says it is going to do.
message PlanItem {
  string id = 1;
  string title = 2;
  PlanStatus status = 3;

  // Why a step was abandoned, or anything else recorded against it. Usually
  // empty.
  string note = 4;
}

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_PENDING = 1;
  PLAN_STATUS_IN_PROGRESS = 2;
  PLAN_STATUS_COMPLETED = 3;

  // A step that will not be done, said rather than deleted: one that
  // disappears reads as one that was finished.
  PLAN_STATUS_ABANDONED = 4;
}

// The whole plan after a change, not the change itself.
//
// Whole on purpose. A client that joined late, or one resuming after events
// were pruned, reads one event and knows the plan; replaying a sequence of
// operations to arrive at it would make the plan the one thing in this log
// that cannot be understood from a single entry.
message PlanChanged {
  repeated PlanItem items = 1;
}

// The run stopping to ask a person something. Every client sees it, so
// whoever is nearest can answer.
//
// Not an approval. An approval asks whether something may happen and is
// answered yes or no; this asks what the person wants and is answered with
// their words.
message QuestionAsked {
  string question_id = 1;
  string call_id = 2;

  // What is being asked, in the model's own words.
  string prompt = 3;

  QuestionKind kind = 4;

  // What may be chosen, for a choice. Empty for free text.
  repeated QuestionOption options = 5;
}

enum QuestionKind {
  QUESTION_KIND_UNSPECIFIED = 0;

  // A fixed set. A model that knows the options should say so rather than
  // hoping the answer matches one.
  QUESTION_KIND_CHOICE = 1;

  // Words — a branch name, a path, a reason.
  QUESTION_KIND_TEXT = 2;
}

message QuestionOption {
  string id = 1;
  string label = 2;

  // What a person needs to tell two options apart when the labels alone do
  // not. Optional.
  string detail = 3;
}

message QuestionAnswered {
  string question_id = 1;
  string call_id = 2;

  QuestionStatus status = 3;

  // The chosen option's id for a choice, or the text as typed.
  string answer = 4;

  // 5 was this field when it was one string.
  reserved 5;

  // Who answered it, and from where.
  //
  // An origin rather than one string, because who and from where are two
  // facts and only one of them is a claim about a person. A platform names
  // whoever pressed a button; a loopback credential names the machine and
  // says nothing about who is at it, so its principal is unset rather than
  // filled in with the name of a program.
  RunOrigin answered_by = 6;
}

enum QuestionStatus {
  QUESTION_STATUS_UNSPECIFIED = 0;
  QUESTION_STATUS_PENDING = 1;
  QUESTION_STATUS_ANSWERED = 2;

  // Nobody will answer, because the run it belonged to ended.
  QUESTION_STATUS_CANCELLED = 3;
}

message ApprovalRequested {
  string approval_id = 1;
  string call_id = 2;
  string tool_name = 3;

  // Arguments exactly as the tool would receive them, so a reviewer judges the
  // real call rather than a rendering of it.
  string arguments = 4;

  string summary = 5;

  // Consequences a reader might not infer from the arguments alone.
  repeated string effects = 6;

  // The call rendered for whoever is deciding — a diff for an edit, the
  // command line for an execution. Empty when the arguments are already the
  // clearest thing to show, and for a tool that cannot render itself.
  //
  // Alongside arguments rather than replacing them: the arguments are what
  // will actually run, and a decision made against a rendering that disagreed
  // with them would be a decision about something else.
  string preview = 7;
  // Whether the run had taken in text somebody else wrote before it asked
  // for this.
  //
  // Not a judgement about the call. It is the one thing a person deciding
  // cannot see for themselves: the request looks the same whether the agent
  // arrived at it or a page it read suggested it, and only the log knows.
  bool read_foreign = 8;
}

message ApprovalResolved {
  string approval_id = 1;
  string call_id = 2;
  string tool_name = 3;

  ApprovalStatus status = 4;
  RememberScope scope = 5;

  // 6 was this field when it was one string.
  reserved 6;

  // Who allowed or refused it, and from where. See QuestionAnswered.
  RunOrigin decided_by = 7;
}

// Cumulative usage for the run so far. Sent as its own event so cost is
// visible while a run is in flight, not only once it ends.
message UsageChanged {
  Usage usage = 1;
}

// Sent once when a subscription opens, so a client knows where the log
// currently ends before live events start arriving.
message StreamHello {
  uint64 head_seq = 1;
}

// Keeps idle connections alive and lets a client notice a stalled stream.
message StreamHeartbeat {
  uint64 head_seq = 1;
}

// ConversationCompacted records that the history up to through_seq has been
// replaced by a summary for the purpose of talking to the model.
//
// Nothing is deleted: the events before through_seq are still in the log and a
// client may still show them. This says only that the model no longer sees
// them, which a client should make visible rather than hide.
message ConversationCompacted {
  string summary = 1;

  // The last event folded into the summary.
  uint64 through_seq = 2;

  int32 messages_folded = 3;

  // Estimates, not the provider's count: the decision to compact has to be
  // made before the request that would report the true figure is sent.
  int64 tokens_before = 4;
  int64 tokens_after = 5;
}

// RunDirections is the part of the system prompt assembled for this run rather
// than fixed when the daemon started.
//
// It is in the log because it has to be. Standing directions come from memory,
// and memory changes; recomputing them when a run resumes after an approval
// would mean the same run was given two different prompts and nothing could
// say which. Everything else the model sees is already derivable from here.
message RunDirections {
  string text = 1;
}

// SkillActivated records that the model asked for an installed skill and was
// given its instructions.
//
// So that "why did it decide to run that" can be answered afterwards with the
// instructions it was following, rather than with a guess about which file
// was on disk at the time.
message SkillActivated {
  string name = 1;

  // Version is what the file claims, for a person reading a listing.
  string version = 2;

  // Digest is what was actually read, and is the identity. A file edited
  // without touching its version line is different instructions wearing the
  // same number.
  string digest = 3;
}
