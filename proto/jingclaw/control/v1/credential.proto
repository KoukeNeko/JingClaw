syntax = "proto3";

package jingclaw.control.v1;

import "google/protobuf/timestamp.proto";
import "jingclaw/control/v1/common.proto";

// CredentialService is how a person puts the keys and tokens the agent needs
// where it will find them, and can never read one back.
//
// A credential is either an environment variable or a file directly inside the
// deployment directory. This service manages the file. It is write-only: nothing
// it returns carries a value, a length, a prefix, a hash or a masked rendering
// of one, and the one thing taken from a file is when it was last modified.
//
// The caller names a slot and never a path. The file's name comes from the
// saved settings (provider.gemini.api_key_file and the like), and has to be a
// plain name the settings are allowed to hold, so no call here can reach a file
// the settings could not have named. A credential is read when its process
// starts, like every other setting, and the replies say when what is saved is
// not what is running yet.
//
// Served by a daemon with no agent as well: a key whose file anybody could read
// is the commonest reason for there being none.
//
// Reachable by the operator's own credential and by nothing else.
service CredentialService {
  // ListCredentials says, for every slot, where its credential would come from
  // and what stops it: never what it is.
  //
  // FAILED_PRECONDITION when the saved settings cannot be read, because no file
  // name is known then.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);

  // PutCredential writes a credential to its file, replacing what was there.
  //
  // INVALID_ARGUMENT for a value that cannot be a credential. FAILED_PRECONDITION
  // when the settings name no usable file for the slot (the reply says which
  // setting to give), when the file is there and is not a credential file, or
  // when expect_modified_at or expect_absent no longer matches. A failed call leaves nothing
  // beside the file and leaves the file as it was, except on a file system that
  // cannot keep a file private: the new file is then removed rather than left
  // readable.
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);

  // DeleteCredential removes the slot's file. Deleting a file that is not there
  // succeeds, and something that is not a credential file is refused.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);

  // RestrictCredentialFile makes an existing file readable by its owner alone,
  // and needs no value. A file anybody could read is not used, and fixing that
  // should not mean typing the key again.
  rpc RestrictCredentialFile(RestrictCredentialFileRequest) returns (RestrictCredentialFileResponse);
}

// CredentialSlot is one place the agent reads a credential from.
enum CredentialSlot {
  CREDENTIAL_SLOT_UNSPECIFIED = 0;

  // provider.gemini.api_key_file
  CREDENTIAL_SLOT_PROVIDER_GEMINI = 1;

  // provider.anthropic.api_key_file
  CREDENTIAL_SLOT_PROVIDER_ANTHROPIC = 2;

  // provider.ollama.api_key_file
  CREDENTIAL_SLOT_PROVIDER_OLLAMA = 3;

  // provider.openai_compat.api_key_file
  CREDENTIAL_SLOT_PROVIDER_OPENAI_COMPAT = 4;

  // memory.embedding.api_key_file
  CREDENTIAL_SLOT_MEMORY_EMBEDDING = 5;

  // web.search.key_file
  CREDENTIAL_SLOT_WEB_SEARCH = 6;

  // gateway.discord.token_file
  CREDENTIAL_SLOT_GATEWAY_DISCORD = 7;

  // gateway.telegram.token_file
  CREDENTIAL_SLOT_GATEWAY_TELEGRAM = 8;
}

// CredentialSource is where a process starting now would take a credential
// from, by the order it looks in: its environment variables, then its file.
enum CredentialSource {
  CREDENTIAL_SOURCE_UNSPECIFIED = 0;

  // One of the environment variables, named in env_in_use.
  CREDENTIAL_SOURCE_ENVIRONMENT = 1;

  // The file.
  CREDENTIAL_SOURCE_FILE = 2;

  // Neither: nothing is set and no file has anything in it.
  CREDENTIAL_SOURCE_NONE = 3;

  // Something is in the way, and the process would refuse to start rather than
  // go past it: a file anybody could read, a file that is not a regular file or
  // cannot be read, or a file name the settings are not allowed to hold. The
  // reason is file_state and file_detail.
  CREDENTIAL_SOURCE_BLOCKED = 4;
}

// CredentialFileState is what is at the slot's file name.
enum CredentialFileState {
  CREDENTIAL_FILE_STATE_UNSPECIFIED = 0;

  // The setting that names the file is empty, so this slot has no file and can
  // only come from the environment.
  CREDENTIAL_FILE_STATE_NO_NAME = 1;

  // The name in the settings is not one a credential file can have. file_detail
  // says what is allowed. The settings do not pass their own check while it is
  // so.
  CREDENTIAL_FILE_STATE_INVALID_NAME = 2;

  // No file by that name, or no deployment directory to hold one.
  CREDENTIAL_FILE_STATE_ABSENT = 3;

  // A file with nothing but whitespace in it, which is read as not being there.
  CREDENTIAL_FILE_STATE_EMPTY = 4;

  // A file with something in it, and owner-only.
  CREDENTIAL_FILE_STATE_PRESENT = 5;

  // A file with something in it that other accounts can read. A process that
  // comes to it refuses to start rather than use it, and file_detail says its
  // mode. RestrictCredentialFile fixes this.
  CREDENTIAL_FILE_STATE_WRONG_MODE = 6;

  // Something that is not a regular file: a directory, a pipe, a device.
  CREDENTIAL_FILE_STATE_NOT_REGULAR = 7;

  // The file is there and could not be looked at or read. file_detail says why.
  CREDENTIAL_FILE_STATE_UNREADABLE = 8;
}

// CredentialNeed is whether the current settings make the slot matter.
enum CredentialNeed {
  CREDENTIAL_NEED_UNSPECIFIED = 0;

  // The process cannot start what the settings ask for without it.
  CREDENTIAL_NEED_REQUIRED = 1;

  // Used when there is one, and not an error when there is not.
  CREDENTIAL_NEED_OPTIONAL = 2;

  // The settings do not select anything that reads it. What the other fields
  // say is what loading it would find, not a sign that anything does.
  CREDENTIAL_NEED_UNUSED = 3;
}

// CredentialProcess is the process that reads a credential.
enum CredentialProcess {
  CREDENTIAL_PROCESS_UNSPECIFIED = 0;
  CREDENTIAL_PROCESS_DAEMON = 1;
  CREDENTIAL_PROCESS_GATEWAY = 2;
}

// Credential is the state of one slot. It never holds the credential.
message Credential {
  CredentialSlot slot = 1;
  CredentialProcess process = 2;

  // Judged by the saved settings, so it is what the next start will want. For a
  // gateway slot that is by gateway.platform: a gateway started with --platform
  // reads the slot of the platform it was given.
  CredentialNeed need = 3;

  // Where a start with the saved settings would take it from.
  CredentialSource source = 4;

  // The setting that names the file, such as provider.gemini.api_key_file, and
  // the name it holds. The name is empty when the setting holds none, and when
  // it holds one that is not allowed, which is not repeated: file_state says so
  // and file_detail says what is allowed.
  string file_setting = 5;
  string file_name = 6;

  // The setting that lists the environment variables, such as
  // provider.gemini.api_key_env, and the names it holds, in the order they are
  // looked at. Names only: nothing of what they are set to.
  string env_setting = 7;
  repeated string env_names = 8;

  // The variable that supplies the credential when source is ENVIRONMENT.
  //
  // This is the daemon's environment. A gateway slot is read by the gateway
  // process, which is started with an environment of its own and may be given a
  // different one, so for a gateway slot this is what the daemon sees and not
  // necessarily what the gateway does.
  string env_in_use = 9;

  // What is at the file's name, whether or not an environment variable is what
  // decides first.
  CredentialFileState file_state = 10;

  // Why, for the states that have a reason: what a name may be for
  // INVALID_NAME, the file's mode for WRONG_MODE, and what the system said for
  // UNREADABLE. Never anything from inside the file.
  string file_detail = 11;

  // When the file was last modified. Unset when there is no file to ask. The
  // only thing this service takes from a file, and what expect_modified_at
  // compares.
  google.protobuf.Timestamp modified_at = 12;

  // Whether a start now would use something other than what this process
  // started with: the file was written after the process began, or this
  // process wrote, restricted or deleted it. False when an environment variable
  // supplies the credential, because the file is then not what decides, and when
  // the slot is unused.
  //
  // A change made to the file by anything else that leaves its modification
  // time alone, a chmod or a delete done by hand, is not seen. For a gateway
  // slot the time compared with is when the daemon began, which is not
  // necessarily when the gateway did.
  bool restart_needed = 13;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  // One for each slot, in the order of the enum.
  repeated Credential credentials = 1;
}

message PutCredentialRequest {
  RequestMeta meta = 1;
  CredentialSlot slot = 2;

  // The credential. It is written to the file and goes nowhere else: not to a
  // log, not to the event log, not back in any reply. One line of UTF-8, at
  // most 8 KiB once the whitespace around it is taken off.
  string value = 3;

  // The modified_at from the ListCredentials this save started from. When set,
  // the save is refused unless the file's modification time is exactly that,
  // which a file written or removed since is not. Compared as a time and never
  // as content. Unset saves over whatever is there.
  google.protobuf.Timestamp expect_modified_at = 4;

  // The ListCredentials this save started from showed no file. The save is
  // refused if there is one now, so that a file written in the meantime is not
  // replaced unseen. Takes the place of expect_modified_at, which a file that
  // did not exist has none to give; if both are set this one wins.
  bool expect_absent = 5;
}

message PutCredentialResponse {
  // The slot as it is now, including the modified_at the next save can expect.
  Credential credential = 1;
}

message DeleteCredentialRequest {
  RequestMeta meta = 1;
  CredentialSlot slot = 2;
}

message DeleteCredentialResponse {
  Credential credential = 1;
}

message RestrictCredentialFileRequest {
  RequestMeta meta = 1;
  CredentialSlot slot = 2;
}

message RestrictCredentialFileResponse {
  Credential credential = 1;
}
