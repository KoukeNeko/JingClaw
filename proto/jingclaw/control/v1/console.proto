syntax = "proto3";

package jingclaw.control.v1;

import "google/protobuf/timestamp.proto";
import "jingclaw/control/v1/common.proto";

// ConsoleService issues the codes a browser uses to get a credential.
//
// It is reachable by the operator's own credential and not by the console's:
// a page that was let in must not be able to let anything else in.
service ConsoleService {
  // IssuePairingCode mints a short-lived, single-use code.
  //
  // The code is what travels — through a terminal's scrollback, a screenshot,
  // an SSH session somebody else can scroll back through — so it is the thing
  // that expires. The credential it buys never appears anywhere a person can
  // read it by accident.
  rpc IssuePairingCode(IssuePairingCodeRequest) returns (IssuePairingCodeResponse);

  // ListConsoleGrants is which browsers can currently reach this agent.
  //
  // Each pairing mints its own credential, so this is a real list rather than
  // a count: without it, "a browser was paired at some point" is the most an
  // operator could know, and revoking one would mean revoking all of them.
  rpc ListConsoleGrants(ListConsoleGrantsRequest) returns (ListConsoleGrantsResponse);

  // RevokeConsoleGrant ends one, or every one.
  rpc RevokeConsoleGrant(RevokeConsoleGrantRequest) returns (RevokeConsoleGrantResponse);
}

message ListConsoleGrantsRequest {
  RequestMeta meta = 1;
}

message ListConsoleGrantsResponse {
  repeated ConsoleGrant grants = 1;
}

// ConsoleGrant is one paired browser.
//
// Without its credential, deliberately. The whole point of a credential here
// is that it never appears anywhere a person can read it by accident, and a
// listing is exactly the sort of thing that ends up in a screenshot.
message ConsoleGrant {
  string id = 1;

  google.protobuf.Timestamp paired_at = 2;
  google.protobuf.Timestamp last_used = 3;

  // What the browser said about itself. Untrusted — it is a User-Agent header
  // — and its only job is to help a person tell two rows apart.
  string label = 4;
}

message RevokeConsoleGrantRequest {
  RequestMeta meta = 1;

  // The grant to end. Ignored when all is set.
  string grant_id = 2;

  // Ends every console session, for somebody who has decided that whatever is
  // out there should not be.
  bool all = 3;
}

message RevokeConsoleGrantResponse {
  // How many were ended. Zero means the id named nothing, which is not the
  // same as success and should not be reported as it.
  int32 revoked = 1;
}

message IssuePairingCodeRequest {
  RequestMeta meta = 1;
}

message IssuePairingCodeResponse {
  string code = 1;

  // The address to open, with the code already in it.
  string url = 2;

  google.protobuf.Timestamp expires_at = 3;
}
