syntax = "proto3";

package jingclaw.control.v1;

import "google/protobuf/timestamp.proto";
import "jingclaw/control/v1/common.proto";
import "jingclaw/control/v1/event.proto";

// A long-lived conversation and workspace. Outlives any single execution.
message Session {
  string id = 1;
  string title = 2;

  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;

  // Which model answers here. Empty uses the daemon's configured one, which
  // is what almost every session does.
  string model = 5;
}

// One "please do something" execution inside a Session.
message Run {
  string id = 1;
  string session_id = 2;

  RunStatus status = 3;

  RunOrigin origin = 4;
  repeated DeliveryTarget delivery_targets = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

message CreateSessionRequest {
  RequestMeta meta = 1;
  string title = 2;
}

message CreateSessionResponse {
  Session session = 1;
}

message SendTurnRequest {
  RequestMeta meta = 1;

  string session_id = 2;
  string text = 3;

  // Files to send with it. The bytes travel here rather than a path, because
  // the daemon may be on another machine reached through a forwarded port and
  // a path would name a file it cannot see.
  repeated InlineAttachment attachments = 4;
}

// InlineAttachment is a file a client is sending with a turn.
//
// The daemon checks it before keeping it, exactly as it checks one arriving
// from a chat platform: a control client is trusted to make requests, which is
// not the same as its files being safe to decode.
message InlineAttachment {
  string name = 1;
  string media_type = 2;
  bytes data = 3;
}

// Deliberately does not carry the answer. The caller subscribes to the event
// stream for that, so closing a client never kills an in-flight model request.
message SendTurnResponse {
  string run_id = 1;
  string message_id = 2;
}

message SubscribeEventsRequest {
  string session_id = 1;

  // Resume point. The server replays everything with seq > after_seq, then
  // stays open for live events. Zero means "from the beginning".
  uint64 after_seq = 2;

  string client_id = 3;
}

message InterruptRunRequest {
  RequestMeta meta = 1;

  string run_id = 2;
  string reason = 3;
}

message InterruptRunResponse {
  RunStatus status = 1;
}

message Approval {
  string id = 1;
  string session_id = 2;
  string run_id = 3;

  string tool_call_id = 4;
  string tool_name = 5;
  string arguments = 6;

  string summary = 7;
  repeated string effects = 8;

  ApprovalStatus status = 9;
  google.protobuf.Timestamp created_at = 10;

  // The call rendered for whoever is deciding. See ApprovalRequested.preview.
  string preview = 11;
}

// Question is a paused run waiting for an answer from a person.
message Question {
  string id = 1;
  string session_id = 2;
  string run_id = 3;
  string tool_call_id = 4;

  string prompt = 5;
  QuestionKind kind = 6;
  repeated QuestionOption options = 7;

  QuestionStatus status = 8;
  string answer = 9;

  google.protobuf.Timestamp created_at = 10;
}

message ListQuestionsRequest {
  string session_id = 1;
}

message ListQuestionsResponse {
  repeated Question questions = 1;
}

message AnswerQuestionRequest {
  RequestMeta meta = 1;
  string question_id = 2;

  // The chosen option's id for a choice, or the text as typed. An empty
  // answer is refused rather than stored: a run resumed with nothing has
  // been told the person had no opinion, which is not what silence means.
  string answer = 3;
}

message AnswerQuestionResponse {
  Question question = 1;
}

message ListApprovalsRequest {
  string session_id = 1;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

message DecideApprovalRequest {
  RequestMeta meta = 1;

  string approval_id = 2;

  // Field 3 was "bool allow". A boolean could not tell a deny from a field the
  // server did not understand, so a client with a typo refused tools on the
  // operator's behalf and reported success.
  reserved 3;
  reserved "allow";

  RememberScope remember = 4;

  // The decision itself, which must be stated. Whether a human may make it,
  // and what it is allowed to unlock, is settled by the daemon's policy rather
  // than by the client.
  ApprovalDecision decision = 5;
}

message DecideApprovalResponse {
  Approval approval = 1;
}

// A message that arrived from an external platform.
message InboundMessage {
  string platform = 1;
  string account_id = 2;
  string tenant_id = 3;
  string channel_id = 4;
  string thread_id = 5;
  string root_message_id = 6;

  string platform_message_id = 7;

  // Deduplicates redelivery. Platforms resend on reconnect, and without this
  // one dropped connection becomes several runs doing the same work.
  string idempotency_key = 8;

  // The platform's stable identifier for the sender. Authorization reads this
  // and never display_name, which its owner can change at will.
  string principal_id = 9;
  string principal_display_name = 10;
  bool principal_is_bot = 11;
  repeated PrincipalClaim principal_claims = 12;

  string text = 13;

  // Why this arrived. Overheard text is not a request.
  MessageTrigger trigger = 14;

  google.protobuf.Timestamp occurred_at = 15;
}

message PrincipalClaim {
  // Namespace identifies the meaning, e.g. "discord.role". Kept opaque because
  // a Discord role and a GitHub collaborator status are not the same kind of
  // thing.
  string namespace = 1;
  string value = 2;
}

enum MessageTrigger {
  MESSAGE_TRIGGER_UNSPECIFIED = 0;
  MESSAGE_TRIGGER_MENTION = 1;
  MESSAGE_TRIGGER_COMMAND = 2;
  MESSAGE_TRIGGER_DIRECT = 3;

  // Overheard in a channel. Never a reason to act on its own.
  MESSAGE_TRIGGER_AMBIENT = 4;
}

message DeliverInboundRequest {
  InboundMessage message = 1;
}

message DeliverInboundResponse {
  string session_id = 1;
  string run_id = 2;

  // Set when the message had already been handled. The caller should post
  // nothing: the reply to the original is already on its way.
  bool duplicate = 3;
}

enum DispatchKind {
  DISPATCH_KIND_UNSPECIFIED = 0;
  DISPATCH_KIND_MESSAGE = 1;
  DISPATCH_KIND_APPROVAL = 2;
  DISPATCH_KIND_STATUS = 3;
}

message Dispatch {
  string id = 1;

  // Monotonic per gateway account. Deliberately not a session's event
  // sequence and not a platform's own; conflating them leaves nobody able to
  // say what a number refers to.
  uint64 seq = 2;

  string session_id = 3;
  string run_id = 4;

  // Where to post it, as an opaque conversation reference the adapter decodes.
  string target = 5;

  DispatchKind kind = 6;
  string payload = 7;

  google.protobuf.Timestamp created_at = 8;
}

// One dispatch, wrapped as the stream's response type per the lint rules.
message SubscribeDispatchesResponse {
  Dispatch dispatch = 1;
}

message SubscribeDispatchesRequest {
  string account_id = 1;

  // The cursor to resume from, so a reconnecting gateway is not handed work it
  // already posted.
  uint64 after_seq = 2;
}

message AcknowledgeDispatchRequest {
  RequestMeta meta = 1;

  string dispatch_id = 2;

  // What the platform called the messages this created, recorded so a later
  // edit can find them.
  repeated string platform_message_ids = 3;
}

message AcknowledgeDispatchResponse {}

message Binding {
  string id = 1;

  string platform = 2;
  string account_id = 3;
  string tenant_id = 4;
  string channel_id = 5;

  string workspace_id = 6;
  string permission_profile = 7;

  repeated string allowed_principals = 8;
  repeated PrincipalClaim allowed_claims = 9;

  google.protobuf.Timestamp created_at = 10;
}

message ListBindingsRequest {}

message ListBindingsResponse {
  repeated Binding bindings = 1;
}

message UpsertBindingRequest {
  RequestMeta meta = 1;
  Binding binding = 2;
}

message UpsertBindingResponse {
  Binding binding = 1;
}

message DeleteBindingRequest {
  RequestMeta meta = 1;
  string binding_id = 2;
}

message DeleteBindingResponse {}

// The ingress a gateway process speaks.
//
// It is a separate service from SessionService so a gateway can be issued a
// credential that reaches only this. A process holding a Discord bot token has
// no business being able to execute tools or read secrets: if its library is
// compromised, the blast radius should be "can deliver messages inward".
service GatewayIngressService {
  rpc DeliverInbound(DeliverInboundRequest) returns (DeliverInboundResponse);
  rpc SubscribeDispatches(SubscribeDispatchesRequest) returns (stream SubscribeDispatchesResponse);
  rpc AcknowledgeDispatch(AcknowledgeDispatchRequest) returns (AcknowledgeDispatchResponse);
}

// Binding management, spoken by an operator's control client rather than by a
// gateway: which channels may reach which workspace is the operator's decision,
// not something the gateway gets to assert about itself.
service ChannelService {
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  rpc UpsertBinding(UpsertBindingRequest) returns (UpsertBindingResponse);
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingResponse);
}

// Frames carried by SubscribeEvents. Named for its RPC per buf's standard
// lint rules; "hello" arrives first, then events, with heartbeats when idle.
message SubscribeEventsResponse {
  oneof value {
    StreamHello hello = 1;
    Event event = 2;
    StreamHeartbeat heartbeat = 3;
    ResyncRequired resync_required = 4;
  }
}

// ResyncRequired says a client asked to resume from before what is kept.
//
// Sent instead of a partial stream. A client resuming from a sequence whose
// events have been pruned would otherwise be handed whatever survived and
// would draw a conversation missing its middle, with nothing to indicate the
// gap — the failure looks like the agent forgetting rather than like history
// being discarded on purpose.
message ResyncRequired {
  // OldestSeq is the earliest event still kept. A client asking from anything
  // below it has to start again from a view.
  uint64 oldest_seq = 1;

  // HeadSeq is where the log is now, so a client can subscribe from a point
  // it knows is whole.
  uint64 head_seq = 2;
}

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // ListSessions is how a client that did not start a session finds it.
  //
  // A run outlives the client that began it, so a second client — the web
  // console, a GUI attaching later — has to be able to discover what is going
  // on without having been there.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);

  // GetSessionView is the state of a session now, without replaying it.
  //
  // A client attaching to a long session would otherwise read every event
  // from the beginning to work out what is on the screen — which is correct
  // and gets slower every turn, until opening a conversation somebody has
  // been using for a week is a visible wait. This gives the answer directly,
  // and a sequence number to subscribe from so nothing between the two is
  // missed.
  rpc GetSessionView(GetSessionViewRequest) returns (GetSessionViewResponse);
  rpc SendTurn(SendTurnRequest) returns (SendTurnResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SubscribeEventsResponse);
  rpc InterruptRun(InterruptRunRequest) returns (InterruptRunResponse);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);

  // ListQuestions is what the agent has asked and nobody has answered.
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);

  // AnswerQuestion unblocks a run that stopped to ask.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);

  // ListModels is what this daemon's provider offers, and which one a session
  // is using.
  //
  // Asked of the provider rather than read from a list here: a local server
  // has whatever somebody pulled onto that machine, and a catalogue written
  // here would be wrong on every deployment that is not this one.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // SetSessionModel chooses which model answers in a session.
  //
  // The next run picks it up. A run already generating has a request open
  // with a model in it, and changing that underneath would attribute a turn
  // to a model that did not write it.
  rpc SetSessionModel(SetSessionModelRequest) returns (SetSessionModelResponse);
}

message ListModelsRequest {
  RequestMeta meta = 1;

  // Which session's current choice to report. Optional; without it, current
  // names the daemon's default.
  string session_id = 2;
}

message ListModelsResponse {
  // Provider is what serves these. There is one per daemon: a conversation
  // carries blocks only its own provider can read back, so moving one to
  // another provider would silently discard them.
  string provider = 1;

  repeated ModelInfo models = 2;

  // Current is the model this session answers with — its own choice where it
  // has one, otherwise the daemon's default.
  string current = 3;

  // Default is what a session with no choice of its own uses.
  string default = 4;
}

message ModelInfo {
  string id = 1;
  string display_name = 2;
  string description = 3;

  // ContextWindow is how much this model can be given, and where that figure
  // came from. A model trained for 128k is routinely loaded with 4k, and a
  // client showing the catalogue's number for a server that says otherwise is
  // showing a number that is wrong.
  int64 context_window = 4;
  string context_source = 5;

  int64 max_output_tokens = 6;
}

message SetSessionModelRequest {
  RequestMeta meta = 1;
  string session_id = 2;

  // Empty goes back to the daemon's default.
  string model = 3;
}

message SetSessionModelResponse {
  Session session = 1;
}

message GetSessionViewRequest {
  RequestMeta meta = 1;
  string session_id = 2;

  // How many of the most recent messages to return. Zero takes the server's
  // own bound. A conversation is read from its end.
  int32 max_messages = 3;
}

message GetSessionViewResponse {
  Session session = 1;

  // Messages, oldest first, ending with the most recent.
  repeated ViewMessage messages = 2;

  // Approvals still waiting on somebody. A client that showed the
  // conversation without these would show a session that appears finished and
  // is actually blocked.
  repeated Approval pending_approvals = 3;

  // The run in flight, if there is one.
  Run active_run = 4;

  // HeadSeq is the last event this view accounts for. Subscribing after it
  // continues exactly where the view stops.
  uint64 head_seq = 5;

  // Truncated says older messages exist than the ones returned.
  bool truncated = 6;

  // What the agent said it was going to do, if it said anything. Here as well
  // as on the event because a client that opened a session rather than
  // watching it happen would otherwise see a run working through a plan it
  // cannot see.
  repeated PlanItem plan = 7;

  // Questions still waiting on somebody. Like pending approvals: a client
  // that showed the conversation without these would show a session that
  // appears finished and is actually waiting to be answered.
  repeated Question pending_questions = 8;
}

// ViewMessage is one turn as a client would draw it.
//
// Assembled by the server because assembling it is the part that costs: a
// message is a user turn, a stream of deltas, and the tool calls between them,
// and every client doing that reconstruction separately is the same bug
// written several times.
message ViewMessage {
  string id = 1;
  MessageRole role = 2;
  string text = 3;

  google.protobuf.Timestamp at = 4;

  // Tools this turn asked for, in order.
  repeated ViewToolCall tool_calls = 5;

  // Seq of the last event that contributed to this message.
  uint64 seq = 6;

  // The model's working-out for this turn, where a provider exposed it.
  //
  // Answered only to a client on the control plane. It never reaches a chat
  // platform: the projector refuses the events it is built from, console
  // channel included.
  string reasoning = 7;
}

message ViewToolCall {
  string call_id = 1;
  string name = 2;
  string summary = 3;

  bool completed = 4;
  bool is_error = 5;

  // Stored output this call produced, when it produced any.
  //
  // Here as well as on the event because a client that opened a session
  // rather than watching it happen has only this: without it, reopening a
  // session loses every way of reaching the build log that explains why
  // something failed.
  Artifact artifact = 6;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

message ListSessionsRequest {
  RequestMeta meta = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message ListRunsRequest {
  RequestMeta meta = 1;
  string session_id = 2;
}

message ListRunsResponse {
  repeated Run runs = 1;
}
